name: postgres_dylan

services:
  postgres:
    image: postgres:16
    container_name: postgres-centurion

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: centurion

    ports:
      - "5432:5432"

    volumes:
      - postgres_data_dylan:/var/lib/postgresql/data

volumes:
  postgres_data_dylan: